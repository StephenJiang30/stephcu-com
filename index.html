<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Stephcu 的个人快捷入口，搜索与常用网站集中在一处。" />
  <title>Stephcu</title>
  <link rel="icon" href="https://cdn.nba.com/teams/uploads/sites/1610612744/2022/06/gsw-logo-1920.png" />
  <style>

:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
  color-scheme: dark;
  --bg: #11151c;
  --surface: #1a202a;
  --surface-soft: #242c39;
  --text: #f1f4f9;
  --muted: #bac3d0;
  --subtle: #9daabd;
  --line: #343e4c;
  --accent: #8eaeff;
  --accent-hover: #bad0ff;
  --accent-soft: #253754;
  --focus: #a6beff;
  --danger: #ff9da4;
  --shadow: 0 6px 22px rgba(0, 0, 0, .12);
  --shadow-hover: 0 16px 40px rgba(0, 0, 0, .25);
  --glass: rgba(19, 30, 48, .78);
  --glass-soft: rgba(19, 30, 48, .70);
  --glass-border: rgba(255, 255, 255, .20);
  --glass-highlight: rgba(255, 255, 255, .13);
  --scrim: rgba(4, 12, 26, .57);
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--text); background: #253b50; -webkit-font-smoothing: antialiased; }
.wallpaper { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-color: #29445e; background-image: url("https://bing.ee123.net/img/?size=1920x1080"), url("https://cn.bing.com/th?id=OHR.MidAutumn2026_ZH-CN8947536773_1920x1080.jpg"), linear-gradient(135deg, #263e58 0%, #597b91 55%, #1b354e 100%); background-size: cover; background-position: center; }
.wallpaper-photo { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; opacity: 0; transition: opacity .7s ease; }
.wallpaper-photo.visible { opacity: 1; }
body::before { content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, var(--scrim), transparent 125%), linear-gradient(180deg, rgba(4, 12, 24, .12), rgba(4, 12, 24, .18) 70%, rgba(4, 12, 24, .35)); }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
a { color: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
.page { position: relative; z-index: 2; width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding-bottom: 96px; }
.header { height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid rgba(255, 255, 255, .32); color: #fff; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 42px; height: 42px; flex: none; border-radius: 13px; background: #fff; padding: 3px; box-shadow: var(--shadow); overflow: hidden; }
.logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.title h1 { font-size: 19px; line-height: 1.15; letter-spacing: -.045em; margin: 0; font-weight: 750; }
.title span { display: block; margin-top: 3px; color: rgba(255, 255, 255, .79); font-size: 11px; font-weight: 650; letter-spacing: .12em; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.round-btn, .text-btn, .small-btn, .danger-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: var(--shadow); transition: border-color .2s, background .2s, transform .2s, box-shadow .2s; }
.round-btn:hover, .text-btn:hover, .small-btn:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.round-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; padding: 0; }
.text-btn { height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 0 16px; font-size: 13px; font-weight: 650; }
.header .text-btn { color: #fff; background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .39); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 8px 28px rgba(0, 0, 0, .10); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
.header .text-btn:hover { color: #fff; background: rgba(255, 255, 255, .23); border-color: rgba(255, 255, 255, .75); }
.hero { padding: clamp(56px, 9vw, 104px) 0 38px; max-width: 820px; }
.wallpaper-badge { width: fit-content; display: inline-flex; align-items: center; gap: 9px; margin-bottom: 22px; padding: 9px 13px; border: 1px solid rgba(255, 255, 255, .48); border-radius: 999px; color: #fff; background: rgba(14, 30, 51, .28); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), 0 8px 24px rgba(0, 0, 0, .10); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); font-size: 12px; font-weight: 650; letter-spacing: .035em; }
.wallpaper-badge::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: #bad3ff; box-shadow: 0 0 0 4px rgba(186, 211, 255, .19); }
.eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .17em; }
.hero h2 { color: #fff; text-shadow: 0 2px 24px rgba(2, 9, 20, .18); font-size: clamp(38px, 5.5vw, 66px); line-height: 1.13; letter-spacing: -.065em; font-weight: 760; margin: 20px 0 16px; }
.hero .eyebrow { color: #e8f0ff; }
.hero h2 em { font-style: normal; color: #e2edff; }
.hero p { color: rgba(255, 255, 255, .92); text-shadow: 0 1px 12px rgba(2, 9, 20, .18); font-size: clamp(15px, 1.7vw, 17px); line-height: 1.75; margin: 0; }
.search-panel { width: min(820px, 100%); border: 1px solid var(--glass-border); border-radius: 18px; padding: 7px; background: var(--glass); box-shadow: 0 20px 55px rgba(3, 14, 28, .20), inset 0 1px 0 var(--glass-highlight); backdrop-filter: blur(28px) saturate(155%); -webkit-backdrop-filter: blur(28px) saturate(155%); }
.engines { display: flex; gap: 4px; align-items: center; padding: 2px 0 8px 2px; border-bottom: 1px solid var(--line); }
.engine-btn { border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 8px 13px; min-height: 40px; display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; transition: background .2s, color .2s; }
.engine-btn:hover { background: var(--surface-soft); color: var(--text); }
.engine-btn.active { background: var(--accent-soft); color: var(--accent); }
.engine-btn img { width: 17px; height: 17px; object-fit: contain; }
.search-form { display: flex; align-items: center; min-width: 0; padding: 8px 7px 1px 12px; gap: 10px; }
.search-glyph { flex: none; color: var(--subtle); }
.search-form input { flex: 1; min-width: 0; height: 49px; border: none; outline: none; background: transparent; color: var(--text); font-size: 16px; }
.search-form input::placeholder { color: var(--subtle); }
.search-submit { flex: none; min-width: 91px; height: 42px; border: 0; border-radius: 10px; background: #2457d6; color: #fff; font-size: 13px; font-weight: 700; transition: background .2s, transform .2s; }
.search-submit:hover { background: #1847bc; transform: translateY(-1px); }
.search-hint { color: rgba(255, 255, 255, .86); font-size: 12px; margin: 13px 0 0 7px; }
kbd { font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.links-section { margin-top: 88px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding-bottom: 19px; border-bottom: 1px solid rgba(255, 255, 255, .38); margin-bottom: 22px; color: #fff; }
.section-head .eyebrow { color: #e8f0ff; }
.section-head h2 { margin: 8px 0 0; font-size: 26px; line-height: 1.25; letter-spacing: -.045em; }
.site-count { color: rgba(255, 255, 255, .86); font-size: 13px; white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--tile-min, 220px)), 1fr)); gap: 14px; }
.tile { min-width: 0; min-height: 156px; padding: 21px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 20px; position: relative; text-decoration: none; background: var(--glass-soft); border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 12px 36px rgba(3, 14, 28, .13), inset 0 1px 0 var(--glass-highlight); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); transition: transform .22s, border-color .22s, box-shadow .22s, background .22s; }
.tile:hover { transform: translateY(-4px); background: var(--glass); border-color: var(--glass-highlight); box-shadow: 0 20px 45px rgba(3, 14, 28, .22), inset 0 1px 0 var(--glass-highlight); }
.tile::after { content: "↗"; position: absolute; right: 20px; top: 20px; color: var(--subtle); font-size: 19px; line-height: 1; transition: color .2s, transform .2s; }
.tile:hover::after { color: var(--accent); transform: translate(2px, -2px); }
.icon-box { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-soft); display: grid; place-items: center; overflow: hidden; }
.icon-box img { width: 25px; height: 25px; object-fit: contain; }
.site-text { min-width: 0; width: 100%; }
.site-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-host { color: var(--subtle); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 5px; }
.empty-state { grid-column: 1 / -1; color: var(--muted); padding: 40px 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.footer { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: rgba(255, 255, 255, .88); font-size: 12px; border-top: 1px solid rgba(255, 255, 255, .38); padding: 22px 0 32px; }
.footer-identity { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.ip-location { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; color: #fff; font-variant-numeric: tabular-nums; }
.ip-location::before { content: "·"; color: rgba(255,255,255,.65); margin-right: 4px; }
.ip-location .flag { font-size: 17px; line-height: 1; }
.ip-location .ip-value { overflow-wrap: anywhere; }
.footer a { text-decoration: underline; text-underline-offset: 3px; }
.footer a:hover { color: #fff; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .search-panel, .tile { background: var(--surface); } }
dialog { width: min(920px, calc(100% - 32px)); max-height: min(88vh, 840px); padding: 0; border: 0; border-radius: 22px; color: var(--text); background: var(--surface); box-shadow: 0 30px 100px rgba(5, 15, 35, .28); overflow: hidden; }
dialog::backdrop { background: rgba(12, 20, 35, .56); backdrop-filter: blur(5px); }
.dialog-card { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: min(88vh, 840px); }
.dialog-head, .dialog-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 26px; }
.dialog-head { border-bottom: 1px solid var(--line); }
.dialog-head h3 { margin: 4px 0 0; font-size: 21px; letter-spacing: -.035em; }
.dialog-foot { border-top: 1px solid var(--line); }
.dialog-body { overflow: auto; padding: 24px 26px; overscroll-behavior: contain; }
.editor-layout { display: grid; grid-template-columns: minmax(240px, 310px) minmax(0, 1fr); align-items: start; gap: 24px; }
.editor-panel { min-width: 0; }
.editor-panel h4 { font-size: 16px; margin: 0; }
.editor-hint { color: var(--subtle); font-size: 12px; margin: 6px 0 18px; }
.field { display: grid; gap: 7px; margin-bottom: 17px; }
.field label { color: var(--muted); font-size: 13px; font-weight: 650; }
.field input { width: 100%; height: 44px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; outline: none; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-actions, .row-actions { display: flex; gap: 8px; align-items: center; }
.primary-btn, .small-btn, .danger-btn { min-height: 38px; padding: 0 13px; border-radius: 9px; font-size: 13px; font-weight: 650; }
.primary-btn { border: 1px solid #2457d6; background: #2457d6; color: #fff; }
.primary-btn:hover { background: #1847bc; }
.danger-btn { color: var(--danger); box-shadow: none; }
.danger-btn:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.site-list { display: grid; gap: 8px; }
.site-row { min-width: 0; display: grid; grid-template-columns: 28px 38px minmax(0, 1fr) auto; gap: 9px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--surface); }
.site-row.dragging { opacity: .5; }
.drag-handle { width: 28px; height: 38px; padding: 0; border: 0; background: transparent; color: var(--subtle); font-size: 18px; cursor: grab; }
.mini-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-soft); overflow: hidden; }
.mini-icon img { width: 24px; height: 24px; object-fit: contain; }
.row-meta { min-width: 0; }
.row-meta strong, .row-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta strong { font-size: 13px; }
.row-meta span { color: var(--subtle); font-size: 11px; margin-top: 4px; }
.row-actions { flex-wrap: nowrap; gap: 5px; }
.row-actions .small-btn { min-height: 32px; min-width: 32px; padding: 0 8px; font-size: 12px; box-shadow: none; }
.toast { position: fixed; z-index: 100; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 10px); background: var(--text); color: var(--surface); border-radius: 10px; padding: 11px 16px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow-hover); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1000px) { .site-row { grid-template-columns: 28px 38px minmax(0, 1fr); } .row-actions { grid-column: 1 / -1; padding-left: 75px; } }
@media (max-width: 700px) { .grid { --tile-min: 170px; } .page { width: calc(100% - 36px); padding-bottom: 58px; } .header { height: 78px; } .hero { padding: 66px 0 30px; } .hero h2 { margin-top: 14px; } .links-section { margin-top: 70px; } .grid { gap: 10px; } .tile { min-height: 142px; padding: 16px; } .editor-layout { grid-template-columns: 1fr; } dialog, .dialog-card { max-height: 92dvh; } .dialog-body { padding: 20px; } .dialog-head, .dialog-foot { padding: 16px 20px; } .site-row { grid-template-columns: 28px 38px minmax(0, 1fr) auto; } .row-actions { grid-column: auto; padding: 0; } }
@media (max-width: 520px) { .page { width: calc(100% - 32px); } .header-actions { gap: 7px; } .text-btn { width: 42px; padding: 0; } .btn-label { display: none; } .hero { padding: 60px 0 26px; } .hero h2 { font-size: clamp(37px, 10vw, 52px); } .hero p { font-size: 14px; } .engine-btn { padding: 8px 10px; font-size: 12px; gap: 6px; } .engine-btn img { width: 16px; height: 16px; } .search-form { padding-left: 7px; gap: 5px; } .search-form input { font-size: 14px; } .search-submit { min-width: 64px; } .search-hint { display: none; } .links-section { margin-top: 66px; } .section-head h2 { font-size: 23px; } .tile { min-height: 132px; } .site-name { font-size: 14px; } dialog { width: 100%; height: 100dvh; max-height: none; border-radius: 0; margin: 0; } .dialog-card { height: 100%; max-height: none; } .dialog-head, .dialog-foot { padding-left: 16px; padding-right: 16px; } .dialog-body { padding: 18px 16px; } .site-row { grid-template-columns: 28px 38px minmax(0, 1fr); } .row-actions { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } .row-actions .small-btn { width: 100%; } .footer { flex-direction: column; align-items: flex-start; } }
@media (max-width: 360px) { .grid { --tile-min: 138px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
  <main class="page">
    <header class="header">
      <div class="brand">
        <div class="logo"><img src="https://cdn.nba.com/teams/uploads/sites/1610612744/2022/06/gsw-logo-1920.png" alt="" /></div>
        <div class="title"><h1>S t e p h c u</h1><span>SPACE</span></div>
      </div>
      <div class="header-actions">
        <button class="text-btn" id="editSitesBtn" type="button" aria-label="管理站点" aria-haspopup="dialog" aria-controls="siteDialog">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
          <span class="btn-label">管理站点</span>
        </button>
      </div>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <span class="wallpaper-badge" id="wallpaperBadge">Bing 每日一图 · 2026.09.25</span><br />
      <span class="eyebrow">YOUR EVERYDAY LAUNCHPAD</span>
      <h2 id="heroTitle">想 去 的 地 方 ，<br /><em>一 触 即 达  。</em></h2>
      <p>Imagine · Brand new day</p>
    </section>

    <section aria-label="网页搜索">
      <div class="search-panel">
        <div class="engines" role="group" aria-label="选择搜索引擎">
          <button class="engine-btn active" data-engine="bing" type="button" aria-label="使用 Bing 搜索" aria-pressed="true"><img src="https://www.bing.com/favicon.ico" alt="" />Bing</button>
          <button class="engine-btn" data-engine="google" type="button" aria-label="使用 Google 搜索" aria-pressed="false"><img src="https://www.google.com/favicon.ico" alt="" />Google</button>
          <button class="engine-btn" data-engine="baidu" type="button" aria-label="使用Baidu搜索" aria-pressed="false"><img src="https://www.baidu.com/favicon.ico" alt="" />Baidu</button>
        </div>
        <form class="search-form" id="searchForm" action="https://www.bing.com/search" method="get" target="_blank">
          <svg class="search-glyph" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4.5 4.5"/></svg>
          <input type="search" name="q" id="searchInput" enterkeyhint="search" placeholder="用 Bing 搜索网页" autocomplete="off" aria-label="搜索关键词" />
          <button class="search-submit" type="submit">搜索</button>
        </form>
      </div>
      <p class="search-hint">提示：按 <kbd>/</kbd> 可快速定位搜索框</p>
    </section>

    <section class="links-section" aria-labelledby="siteTitle">
      <div class="section-head">
        <div><span class="eyebrow">Design By You</span><h2 id="siteTitle">快捷入口</h2></div>
        <span class="site-count" id="siteCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <footer class="footer page"><span class="footer-identity"><span>Stephcu</span><span class="ip-location" id="ipLocation" role="status" aria-live="polite">正在获取 IP…</span></span><span>背景来自 <a href="https://www.bing.com/" target="_blank" rel="noopener noreferrer">Bing</a> · 快捷入口保存在当前浏览器</span></footer>

  <dialog id="siteDialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <div><span class="eyebrow">MANAGE SHORTCUTS</span><h3>管理快捷入口</h3></div>
        <button class="round-btn" id="closeDialogBtn" type="button" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="dialog-body">
        <div class="editor-layout">
          <section class="editor-panel">
            <h4 id="formTitle">添加站点</h4><p class="editor-hint">保存后会立即显示在首页</p>
            <form id="siteForm" novalidate>
              <input type="hidden" id="editingId" />

              <div class="field">
                <label for="siteName">名称</label>
                <input id="siteName" maxlength="40" autocomplete="off" required />
              </div>

              <div class="field">
                <label for="siteUrl">链接</label>
                <input id="siteUrl" inputmode="url" placeholder="https://example.com" required />
              </div>

              <div class="field">
                <label for="siteIcon">图标链接（可选）</label>
                <input id="siteIcon" inputmode="url" placeholder="https://example.com/icon.png" />
              </div>

              <div class="form-actions">
                <button class="primary-btn" type="submit" id="saveSiteBtn">保存</button>
                <button class="small-btn" type="button" id="cancelEditBtn">清空</button>
              </div>
            </form>
          </section>

          <section class="editor-panel">
            <h4>站点列表</h4><p class="editor-hint">拖动排序，或使用上下移动按钮</p>
            <div class="site-list" id="siteList"></div>
          </section>
        </div>
      </div>

      <div class="dialog-foot">
        <div class="foot-actions">
          <button class="danger-btn" id="resetBtn" type="button">恢复默认</button>
        </div>
        <button class="small-btn" id="doneBtn" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      "use strict";

      const DEFAULT_SITES = [
        { id: "google", name: "Google", url: "https://www.google.com", icon: "" },
        { id: "chatgpt", name: "ChatGPT", url: "https://chatgpt.com", icon: "" },
        { id: "gemini", name: "Gemini", url: "https://gemini.google.com", icon: "" },
        { id: "github", name: "GitHub", url: "https://github.com", icon: "" },
        { id: "youtube", name: "YouTube", url: "https://www.youtube.com", icon: "" },
        { id: "netflix", name: "Netflix", url: "https://www.netflix.com", icon: "" },
        { id: "apple-music", name: "Apple Music", url: "https://music.apple.com/cn/browse", icon: "" },
        { id: "internet-archive", name: "Internet Archive", url: "https://archive.org", icon: "" },
        { id: "bilibili", name: "Bilibili", url: "https://www.bilibili.com", icon: "" },
        { id: "douyin", name: "抖音", url: "https://www.douyin.com", icon: "" },
        { id: "cnki", name: "中国知网", url: "https://www.cnki.net", icon: "" },
        { id: "yanweb", name: "科研工具", url: "https://www.yanweb.top/", icon: "" },
        { id: "zdic", name: "汉典", url: "https://www.zdic.net", icon: "" },
        { id: "shidianguji", name: "识典古籍", url: "https://www.shidianguji.com/zh", icon: "" },
        { id: "gzhu", name: "数字广大", url: "https://webvpn.gzhu.edu.cn/https/77726476706e69737468656265737421fef256913e7e6f4a761dc7a99c406d36d9/up/view?m=up#act=portal/viewhome", icon: "" }
      ];

      const ENGINES = {
        bing: { action: "https://www.bing.com/search", name: "q", placeholder: "用 Bing 搜索网页" },
        google: { action: "https://www.google.com/search", name: "q", placeholder: "用 Google 搜索网页" },
        baidu: { action: "https://www.baidu.com/s", name: "wd", placeholder: "用Baidu搜索网页" }
      };

      const STORAGE = {
        sites: "stephcu.sites.v4",
        engine: "stephcu.engine.v4"
      };

      const editSitesBtn = document.getElementById("editSitesBtn");
      const grid = document.getElementById("grid");
      const siteCount = document.getElementById("siteCount");
      const siteDialog = document.getElementById("siteDialog");
      const closeDialogBtn = document.getElementById("closeDialogBtn");
      const doneBtn = document.getElementById("doneBtn");
      const siteForm = document.getElementById("siteForm");
      const editingId = document.getElementById("editingId");
      const siteName = document.getElementById("siteName");
      const siteUrl = document.getElementById("siteUrl");
      const siteIcon = document.getElementById("siteIcon");
      const formTitle = document.getElementById("formTitle");
      const saveSiteBtn = document.getElementById("saveSiteBtn");
      const cancelEditBtn = document.getElementById("cancelEditBtn");
      const siteList = document.getElementById("siteList");
      const resetBtn = document.getElementById("resetBtn");
      const toast = document.getElementById("toast");
      const wallpaper = document.getElementById("wallpaper");
      const wallpaperBadge = document.getElementById("wallpaperBadge");
      const ipLocation = document.getElementById("ipLocation");
      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const engineBtns = [...document.querySelectorAll(".engine-btn")];

      let sites = loadSites();
      let selectedEngine = storageGet(STORAGE.engine) || "bing";
      let draggedId = null;
      let wallpaperDay = "";

      // 静态文件无需跨域读取图片信息，图片接口会直接跳转到当日的 Bing 壁纸。
      function refreshWallpaper() {
        const day = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());
        if (day === wallpaperDay) return;
        wallpaperDay = day;
        wallpaperBadge.textContent = `Bing 每日一图 · ${day.replaceAll("-", ".")}`;

        const sources = [
          `https://bing.ee123.net/img/?size=1920x1080&date=${day.replaceAll("-", "")}`,
          `https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN&day=${day}`,
          `https://api.dujin.org/bing/1920.php?day=${day}`
        ];
        let sourceIndex = 0;
        const loadNext = () => {
          if (sourceIndex >= sources.length) return;
          const url = sources[sourceIndex++];
          const image = new Image();
          image.alt = "";
          image.className = "wallpaper-photo";
          image.referrerPolicy = "no-referrer";
          const timeout = window.setTimeout(() => {
            image.onload = image.onerror = null;
            loadNext();
          }, 12000);
          image.onload = () => {
            window.clearTimeout(timeout);
            wallpaper.replaceChildren(image);
            window.requestAnimationFrame(() => image.classList.add("visible"));
          };
          image.onerror = () => {
            window.clearTimeout(timeout);
            loadNext();
          };
          image.src = url;
        };
        loadNext();
      }

      function storageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // 某些浏览器在 file:// 或隐私模式下可能禁用本地存储。
        }
      }

      function cloneDefaults() {
        return DEFAULT_SITES.map(site => ({ ...site }));
      }

      function loadSites() {
        const raw = storageGet(STORAGE.sites);
        if (!raw) return cloneDefaults();

        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return cloneDefaults();

          return parsed
            .map(item => ({
              id: String(item.id || createId()),
              name: String(item.name || "").trim(),
              url: normalizeUrl(item.url),
              icon: item.icon ? normalizeUrl(item.icon) : ""
            }))
            .filter(item => item.name && isHttpUrl(item.url));
        } catch {
          return cloneDefaults();
        }
      }

      function saveSites() {
        storageSet(STORAGE.sites, JSON.stringify(sites));
      }

      function createId() {
        return window.crypto?.randomUUID?.() || `site-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        return /^https?:\/\//i.test(text) ? text : `https://${text}`;
      }

      function isHttpUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function hostOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }

      function getIconCandidates(site) {
        const host = hostOf(site.url);
        const candidates = [];

        if (site.icon && isHttpUrl(site.icon)) candidates.push(site.icon);
        candidates.push(`https://api.iowen.cn/favicon/${host}.png`);
        candidates.push(`https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(site.url)}`);
        candidates.push(`https://icons.duckduckgo.com/ip3/${host}.ico`);
        candidates.push(makeLetterIcon(site.name));

        return candidates;
      }

      function makeLetterIcon(name) {
        const letter = (String(name).trim()[0] || "S").toUpperCase().replace(/[<>&\"']/g, "");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aa8ff"/><stop offset="1" stop-color="#4a5fe8"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><text x="32" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="700" fill="white">${letter}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function setIconWithFallback(img, site) {
        const candidates = getIconCandidates(site);
        let index = 0;

        const next = () => {
          if (index >= candidates.length) return;
          img.src = candidates[index++];
        };

        img.onerror = next;
        next();
      }

      function renderSites() {
        grid.textContent = "";
        const fragment = document.createDocumentFragment();

        sites.forEach(site => {
          const link = document.createElement("a");
          link.className = "tile glass";
          link.href = site.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.title = site.name;

          const iconBox = document.createElement("div");
          iconBox.className = "icon-box";

          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          setIconWithFallback(img, site);
          iconBox.appendChild(img);

          const text = document.createElement("div");
          text.className = "site-text";

          const name = document.createElement("div");
          name.className = "site-name";
          name.textContent = site.name;

          const host = document.createElement("div");
          host.className = "site-host";
          host.textContent = hostOf(site.url);

          text.append(name, host);
          link.append(iconBox, text);
          fragment.appendChild(link);
        });

        grid.appendChild(fragment);
        siteCount.textContent = `${sites.length} 个站点`;
        if (!sites.length) grid.innerHTML = '<p class="empty-state">还没有快捷入口，点击右上角的“管理站点”添加。</p>';
      }

      function renderEditorList() {
        siteList.textContent = "";
        const fragment = document.createDocumentFragment();

        sites.forEach((site, index) => {
          const row = document.createElement("div");
          row.className = "site-row";
          row.draggable = true;
          row.dataset.id = site.id;

          const handle = document.createElement("button");
          handle.type = "button";
          handle.className = "drag-handle";
          handle.title = "拖动排序";
          handle.setAttribute("aria-label", `拖动 ${site.name}`);
          handle.textContent = "⋮⋮";

          const icon = document.createElement("div");
          icon.className = "mini-icon";
          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          setIconWithFallback(img, site);
          icon.appendChild(img);

          const meta = document.createElement("div");
          meta.className = "row-meta";
          const name = document.createElement("strong");
          name.textContent = site.name;
          const url = document.createElement("span");
          url.textContent = site.url;
          meta.append(name, url);

          const actions = document.createElement("div");
          actions.className = "row-actions";

          const upBtn = makeActionButton("↑", "上移", () => moveSite(index, index - 1));
          const downBtn = makeActionButton("↓", "下移", () => moveSite(index, index + 1));
          const editBtn = makeActionButton("编辑", `编辑 ${site.name}`, () => beginEdit(site.id));
          const deleteBtn = makeActionButton("删除", `删除 ${site.name}`, () => deleteSite(site.id));

          upBtn.disabled = index === 0;
          downBtn.disabled = index === sites.length - 1;

          actions.append(upBtn, downBtn, editBtn, deleteBtn);
          row.append(handle, icon, meta, actions);

          row.addEventListener("dragstart", event => {
            draggedId = site.id;
            row.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
          });

          row.addEventListener("dragend", () => {
            draggedId = null;
            row.classList.remove("dragging");
          });

          row.addEventListener("dragover", event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
          });

          row.addEventListener("drop", event => {
            event.preventDefault();
            if (!draggedId || draggedId === site.id) return;
            const from = sites.findIndex(item => item.id === draggedId);
            const to = sites.findIndex(item => item.id === site.id);
            moveSite(from, to);
          });

          fragment.appendChild(row);
        });

        siteList.appendChild(fragment);
      }

      function makeActionButton(text, label, handler) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "small-btn";
        button.textContent = text;
        button.setAttribute("aria-label", label);
        button.addEventListener("click", handler);
        return button;
      }

      function moveSite(from, to) {
        if (from < 0 || to < 0 || from >= sites.length || to >= sites.length || from === to) return;
        const next = sites.slice();
        const [item] = next.splice(from, 1);
        next.splice(to, 0, item);
        sites = next;
        saveSites();
        renderAll();
      }

      function beginEdit(id) {
        const site = sites.find(item => item.id === id);
        if (!site) return;

        editingId.value = site.id;
        siteName.value = site.name;
        siteUrl.value = site.url;
        siteIcon.value = site.icon || "";
        formTitle.textContent = "编辑站点";
        saveSiteBtn.textContent = "更新";
        siteName.focus();
      }

      function clearForm() {
        editingId.value = "";
        siteForm.reset();
        formTitle.textContent = "添加站点";
        saveSiteBtn.textContent = "保存";
      }

      function deleteSite(id) {
        const site = sites.find(item => item.id === id);
        if (!site) return;
        if (!window.confirm(`确定删除“${site.name}”吗？`)) return;

        sites = sites.filter(item => item.id !== id);
        saveSites();
        clearForm();
        renderAll();
        showToast("已删除");
      }

      function handleSiteSubmit(event) {
        event.preventDefault();

        const id = editingId.value.trim();
        const name = siteName.value.trim();
        const url = normalizeUrl(siteUrl.value);
        const icon = siteIcon.value.trim() ? normalizeUrl(siteIcon.value) : "";

        if (!name) {
          showToast("请输入站点名称");
          siteName.focus();
          return;
        }

        if (!isHttpUrl(url)) {
          showToast("请输入有效链接");
          siteUrl.focus();
          return;
        }

        if (icon && !isHttpUrl(icon)) {
          showToast("请输入有效图标链接");
          siteIcon.focus();
          return;
        }

        const duplicate = sites.some(item => item.url === url && item.id !== id);
        if (duplicate) {
          showToast("该链接已存在");
          return;
        }

        if (id) {
          sites = sites.map(item => item.id === id ? { id, name, url, icon } : item);
          showToast("已更新");
        } else {
          sites.push({ id: createId(), name, url, icon });
          showToast("已添加");
        }

        saveSites();
        clearForm();
        renderAll();
      }

      function resetSites() {
        if (!window.confirm("恢复全部默认站点？")) return;
        sites = cloneDefaults();
        saveSites();
        clearForm();
        renderAll();
        showToast("已恢复默认站点");
      }

      function renderAll() {
        renderSites();
        renderEditorList();
      }

      function flagFor(code) {
        if (!/^[A-Z]{2}$/.test(code)) return "🌐";
        return [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join("");
      }

      function showIpLocation(data) {
        const ip = String(data.ip || "").trim();
        const code = String(data.country_code || data.country || "").toUpperCase();
        if (!ip || ip.length > 45 || !/^[0-9a-fA-F:.]+$/.test(ip)) throw new Error("无效 IP");
        const regionName = /^[A-Z]{2}$/.test(code) && typeof Intl.DisplayNames === "function"
          ? new Intl.DisplayNames(["zh-CN"], { type: "region" }).of(code)
          : String(data.country_name || data.country || "未知地区");
        ipLocation.replaceChildren();
        const flag = document.createElement("span");
        flag.className = "flag";
        flag.textContent = flagFor(code);
        const region = document.createElement("span");
        region.textContent = regionName;
        const address = document.createElement("span");
        address.className = "ip-value";
        address.textContent = ip;
        ipLocation.append(flag, region, address);
        ipLocation.title = `公网 IP：${ip}`;
      }

      async function loadIpLocation() {
        const endpoints = ["https://ipapi.co/json/", "https://ipwho.is/"];
        for (const url of endpoints) {
          const controller = new AbortController();
          const timer = window.setTimeout(() => controller.abort(), 6500);
          try {
            const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
            if (!response.ok) throw new Error("请求失败");
            const data = await response.json();
            if (data.success === false || data.error) throw new Error("查询失败");
            showIpLocation(data);
            return;
          } catch {
            // 网络不可用时尝试下一个接口。
          } finally {
            window.clearTimeout(timer);
          }
        }
        ipLocation.textContent = "🌐 IP 信息暂不可用";
      }

      function applyEngine(type) {
        const config = ENGINES[type] || ENGINES.bing;
        selectedEngine = ENGINES[type] ? type : "bing";
        storageSet(STORAGE.engine, selectedEngine);

        searchForm.action = config.action;
        searchInput.name = config.name;
        searchInput.placeholder = config.placeholder;

        engineBtns.forEach(button => {
          const active = button.dataset.engine === selectedEngine;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      editSitesBtn.addEventListener("click", () => {
        siteDialog.showModal();
        renderEditorList();
        closeDialogBtn.focus();
      });
      closeDialogBtn.addEventListener("click", () => siteDialog.close());
      doneBtn.addEventListener("click", () => siteDialog.close());
      cancelEditBtn.addEventListener("click", clearForm);
      siteForm.addEventListener("submit", handleSiteSubmit);
      resetBtn.addEventListener("click", resetSites);

      engineBtns.forEach(button => {
        button.addEventListener("click", () => applyEngine(button.dataset.engine));
      });

      document.addEventListener("keydown", event => {
        if (event.key !== "/" || event.altKey || event.ctrlKey || event.metaKey || siteDialog.open) return;
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
        event.preventDefault();
        searchInput.focus();
      });

      searchForm.addEventListener("submit", event => {
        if (!searchInput.value.trim()) {
          event.preventDefault();
          searchInput.focus();
        }
      });

      window.addEventListener("storage", event => {
        if (event.key === STORAGE.sites) {
          sites = loadSites();
          renderAll();
        }
        if (event.key === STORAGE.engine) {
          applyEngine(event.newValue || "bing");
        }
      });

      if (!ENGINES[selectedEngine]) selectedEngine = "bing";
      applyEngine(selectedEngine);
      renderAll();
      refreshWallpaper();
      loadIpLocation();
      window.setInterval(refreshWallpaper, 10 * 60 * 1000);
    })();
  </script>
</body>
</html>
