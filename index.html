<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Stephcu</title>
  <link rel="icon" href="https://cdn.nba.com/teams/uploads/sites/1610612744/2022/06/gsw-logo-1920.png" />

  <style>
    :root {
      --ease: cubic-bezier(.22, .8, .22, 1);
      --spring: cubic-bezier(.16, 1, .3, 1);
      --blur: blur(28px) saturate(185%) contrast(108%);
      --blur-strong: blur(38px) saturate(200%) contrast(110%);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --content-width: 1180px;
      --font-apple-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-apple-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="light"] {
      --bg-a: #dcecff;
      --bg-b: #f7fbff;
      --bg-c: #e8e1ff;
      --text: #172033;
      --muted: #657089;
      --glass: rgba(255, 255, 255, .31);
      --glass-strong: rgba(255, 255, 255, .46);
      --glass-hover: rgba(255, 255, 255, .59);
      --glass-soft: rgba(255, 255, 255, .18);
      --border: rgba(255, 255, 255, .72);
      --inner-border: rgba(255, 255, 255, .38);
      --shadow: 0 22px 70px rgba(57, 78, 121, .18), 0 2px 8px rgba(37, 54, 90, .08);
      --shadow-hover: 0 28px 80px rgba(57, 78, 121, .25), 0 8px 22px rgba(37, 54, 90, .12);
      --input: rgba(255, 255, 255, .28);
      --active: rgba(255, 255, 255, .56);
      --icon-bg: rgba(255, 255, 255, .74);
      --focus: #2b6ff4;
      --danger: #d34d4d;
      --button-text: #172033;
      --dialog-backdrop: rgba(69, 83, 116, .24);
      --fluid-blue-core: rgba(149, 215, 255, .92);
      --fluid-blue-mid: rgba(94, 169, 255, .56);
      --fluid-blue-edge: rgba(86, 136, 255, .12);
      --fluid-pink-core: rgba(255, 205, 229, .9);
      --fluid-pink-mid: rgba(255, 143, 202, .5);
      --fluid-pink-edge: rgba(241, 111, 183, .1);
      --fluid-mix-core: rgba(226, 211, 255, .72);
      --fluid-mix-mid: rgba(177, 151, 255, .34);
      --ambient-overlay: rgba(249, 252, 255, .14);
    }

    html[data-theme="dark"] {
      --bg-a: #071221;
      --bg-b: #0d1b2f;
      --bg-c: #17142d;
      --text: #f4f7ff;
      --muted: #a8b3c9;
      --glass: rgba(9, 21, 39, .43);
      --glass-strong: rgba(14, 31, 54, .56);
      --glass-hover: rgba(29, 51, 79, .58);
      --glass-soft: rgba(255, 255, 255, .055);
      --border: rgba(255, 255, 255, .22);
      --inner-border: rgba(255, 255, 255, .09);
      --shadow: 0 24px 80px rgba(0, 0, 0, .38), 0 2px 10px rgba(0, 0, 0, .22);
      --shadow-hover: 0 30px 90px rgba(0, 0, 0, .48), 0 9px 28px rgba(0, 0, 0, .28);
      --input: rgba(255, 255, 255, .07);
      --active: rgba(255, 255, 255, .13);
      --icon-bg: rgba(255, 255, 255, .9);
      --focus: #7ca6ff;
      --danger: #ff8a8a;
      --button-text: #f4f7ff;
      --dialog-backdrop: rgba(0, 5, 14, .54);
      --fluid-blue-core: rgba(85, 224, 255, .95);
      --fluid-blue-mid: rgba(0, 135, 255, .62);
      --fluid-blue-edge: rgba(0, 68, 255, .12);
      --fluid-pink-core: rgba(255, 87, 199, .92);
      --fluid-pink-mid: rgba(255, 0, 132, .58);
      --fluid-pink-edge: rgba(190, 0, 100, .12);
      --fluid-mix-core: rgba(192, 99, 255, .76);
      --fluid-mix-mid: rgba(102, 57, 255, .42);
      --ambient-overlay: rgba(3, 10, 23, .18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-b);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-apple-text);
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(circle at 12% 4%, rgba(255, 255, 255, .72), transparent 28%),
        linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      transition: color .45s var(--ease), background .8s var(--ease);
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    input {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--ambient-overlay);
      isolation: isolate;
    }

    /* 细微纹理与中心提亮，让流体在玻璃后方清晰可见，但不干扰文字。 */
    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      background:
        radial-gradient(ellipse at 50% 34%, transparent 0 28%, rgba(255,255,255,.055) 62%, rgba(255,255,255,.1) 100%),
        repeating-radial-gradient(circle at 18% 24%, rgba(255,255,255,.055) 0 1px, transparent 1px 12px);
      opacity: .32;
      mix-blend-mode: soft-light;
    }

    /* 可读性遮罩：中央内容区域更平静，边缘保留流体色彩。 */
    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.2) 0 18%, rgba(255,255,255,.08) 42%, transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 30%, transparent 72%, rgba(255,255,255,.05));
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 42% 58% 61% 39% / 44% 38% 62% 56%;
      filter: blur(18px) saturate(128%);
      opacity: .78;
      will-change: transform, border-radius;
      transform-origin: center;
      animation:
        fluidDrift 20s cubic-bezier(.45,.05,.25,.95) infinite alternate,
        fluidMorph 13s ease-in-out infinite alternate;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
    }

    .orb::before {
      inset: 10%;
      background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.54), transparent 34%);
      filter: blur(7px);
      opacity: .72;
    }

    .orb::after {
      inset: 18% 8% 8% 20%;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: inset 0 0 44px rgba(255,255,255,.09);
      opacity: .54;
    }

    .orb.one {
      width: 48vmax;
      height: 39vmax;
      left: -18vmax;
      top: -12vmax;
      background:
        radial-gradient(circle at 38% 34%, rgba(255,255,255,.72), transparent 15%),
        radial-gradient(circle at 58% 58%, var(--fluid-blue-core) 0 20%, var(--fluid-blue-mid) 46%, var(--fluid-blue-edge) 70%, transparent 76%);
      transform: rotate(-13deg);
    }

    .orb.two {
      width: 43vmax;
      height: 46vmax;
      right: -17vmax;
      top: -4vmax;
      background:
        radial-gradient(circle at 42% 30%, rgba(255,255,255,.58), transparent 16%),
        radial-gradient(circle at 44% 52%, var(--fluid-pink-core) 0 18%, var(--fluid-pink-mid) 45%, var(--fluid-pink-edge) 70%, transparent 77%);
      animation-duration: 24s, 16s;
      animation-delay: -7s, -3s;
      transform: rotate(17deg);
    }

    .orb.three {
      width: 42vmax;
      height: 32vmax;
      left: 27%;
      bottom: -18vmax;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,.42), transparent 17%),
        radial-gradient(circle at 48% 48%, var(--fluid-mix-core) 0 18%, var(--fluid-mix-mid) 48%, transparent 76%);
      opacity: .62;
      animation-duration: 28s, 18s;
      animation-delay: -12s, -6s;
      transform: rotate(-8deg);
    }

    html[data-theme="dark"] .ambient::before {
      opacity: .48;
      background:
        radial-gradient(circle at 16% 15%, rgba(255,255,255,.36) 0 1px, transparent 1.5px),
        radial-gradient(circle at 66% 24%, rgba(255,255,255,.24) 0 1px, transparent 1.5px),
        radial-gradient(circle at 82% 72%, rgba(255,255,255,.2) 0 1px, transparent 1.5px),
        repeating-radial-gradient(circle at 18% 24%, rgba(255,255,255,.045) 0 1px, transparent 1px 20px);
      background-size: 260px 260px, 340px 340px, 430px 430px, auto;
    }

    html[data-theme="dark"] .ambient::after {
      background:
        radial-gradient(ellipse at 50% 38%, rgba(3,10,24,.18) 0 16%, rgba(3,10,24,.34) 48%, rgba(2,7,17,.5) 100%),
        linear-gradient(180deg, rgba(2,7,17,.08), transparent 26%, transparent 70%, rgba(2,7,17,.34));
    }

    html[data-theme="dark"] .orb {
      filter: blur(21px) saturate(150%);
      mix-blend-mode: screen;
    }

    html[data-theme="dark"] .orb.one {
      opacity: .74;
      box-shadow: 0 0 90px rgba(0, 162, 255, .18);
    }

    html[data-theme="dark"] .orb.two {
      opacity: .7;
      box-shadow: 0 0 96px rgba(255, 0, 145, .16);
    }

    html[data-theme="dark"] .orb.three {
      opacity: .5;
    }

    @keyframes fluidDrift {
      0% { transform: translate3d(-3%, -2%, 0) rotate(-8deg) scale(1); }
      42% { transform: translate3d(5%, 2%, 0) rotate(5deg) scale(1.07); }
      100% { transform: translate3d(1%, 8%, 0) rotate(12deg) scale(.98); }
    }

    @keyframes fluidMorph {
      0% { border-radius: 42% 58% 61% 39% / 44% 38% 62% 56%; }
      45% { border-radius: 58% 42% 39% 61% / 52% 61% 39% 48%; }
      100% { border-radius: 37% 63% 54% 46% / 62% 44% 56% 38%; }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(24px, 5vw, 64px) 0 56px;
    }

    .glass {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), transparent 38%),
        var(--glass);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.07);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background:
        radial-gradient(380px 160px at 12% -6%, rgba(255,255,255,.46), transparent 66%),
        linear-gradient(120deg, transparent 10%, rgba(255,255,255,.12) 34%, transparent 56%);
      opacity: .72;
      pointer-events: none;
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: inherit;
      border: 1px solid var(--inner-border);
      pointer-events: none;
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass {
        background: var(--glass-strong);
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      border-radius: var(--radius-xl);
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      border-radius: 17px;
      overflow: hidden;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: 0 12px 28px rgba(16, 34, 66, .22), inset 0 1px 0 rgba(255,255,255,.6);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-family: var(--font-apple-display);
      font-weight: 700;
      font-size: clamp(22px, 2.3vw, 30px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .title span {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .round-btn,
    .text-btn,
    .engine-btn,
    .small-btn,
    .primary-btn,
    .danger-btn {
      border: 1px solid var(--border);
      background: var(--glass-soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      color: var(--button-text);
      cursor: pointer;
      transition: transform .22s var(--spring), background .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease);
    }

    .round-btn {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .text-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 650;
    }

    .round-btn:hover,
    .text-btn:hover,
    .engine-btn:hover,
    .small-btn:hover,
    .primary-btn:hover,
    .danger-btn:hover {
      transform: translateY(-2px);
      background: var(--glass-hover);
      box-shadow: 0 10px 24px rgba(24, 43, 76, .13), inset 0 1px 0 rgba(255,255,255,.25);
    }

    .round-btn:active,
    .text-btn:active,
    .engine-btn:active,
    .small-btn:active,
    .primary-btn:active,
    .danger-btn:active {
      transform: scale(.97);
    }

    .theme-icon {
      width: 22px;
      height: 22px;
    }

    .search-panel {
      width: min(760px, 100%);
      margin: 0 auto 42px;
      padding: 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .engines {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 2px;
    }

    .engine-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .engine-btn.active {
      background: var(--active);
      border-color: var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 14px rgba(23, 37, 64, .08);
    }

    .engine-btn img {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .search-form {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--inner-border);
    }

    .search-form input {
      width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0 16px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-form input::placeholder {
      color: var(--muted);
      opacity: .9;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.015em;
    }

    .site-count {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .tile {
      min-height: 86px;
      padding: 14px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 13px;
      text-decoration: none;
      color: inherit;
      transition: transform .26s var(--spring), background .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    }

    .tile:hover {
      transform: translateY(-5px) scale(1.01);
      background:
        linear-gradient(135deg, rgba(255,255,255,.32), transparent 42%),
        var(--glass-hover);
      border-color: rgba(255,255,255,.62);
      box-shadow: var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,.32);
    }

    .icon-box {
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--icon-bg);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 8px 18px rgba(16, 31, 58, .14), inset 0 1px 0 rgba(255,255,255,.72);
      overflow: hidden;
    }

    .icon-box img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .site-text {
      min-width: 0;
    }

    .site-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-host {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    dialog {
      width: min(900px, calc(100% - 24px));
      max-height: min(88vh, 860px);
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text);
      overflow: visible;
    }

    dialog::backdrop {
      background: var(--dialog-backdrop);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }

    .dialog-card {
      max-height: min(88vh, 860px);
      border-radius: 30px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background:
        linear-gradient(145deg, rgba(255,255,255,.22), transparent 38%),
        var(--glass-strong);
      backdrop-filter: var(--blur-strong);
      -webkit-backdrop-filter: var(--blur-strong);
    }

    .dialog-head,
    .dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
    }

    .dialog-head {
      border-bottom: 1px solid var(--inner-border);
    }

    .dialog-foot {
      border-top: 1px solid var(--inner-border);
      flex-wrap: wrap;
    }

    .dialog-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .dialog-body {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .editor-panel {
      padding: 16px;
      border-radius: 22px;
      background: var(--glass-soft);
      border: 1px solid var(--inner-border);
    }

    .editor-panel h4 {
      margin: 0 0 14px;
      font-size: 15px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 650;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--inner-border);
      border-radius: 13px;
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent);
    }

    .form-actions,
    .foot-actions,
    .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .danger-btn,
    .small-btn {
      border-radius: 12px;
      min-height: 38px;
      padding: 0 13px;
    }

    .primary-btn {
      color: white;
      border-color: rgba(255,255,255,.24);
      background: linear-gradient(135deg, #4e8df7, #3265df);
      box-shadow: 0 10px 22px rgba(44, 100, 220, .25), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .danger-btn {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 9%, transparent);
    }

    .site-list {
      display: grid;
      gap: 10px;
    }

    .site-row {
      display: grid;
      grid-template-columns: 34px 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--inner-border);
      background: var(--glass-soft);
      transition: transform .2s var(--ease), opacity .2s var(--ease), border-color .2s var(--ease);
    }

    .site-row.dragging {
      opacity: .5;
      transform: scale(.985);
    }

    .drag-handle {
      width: 34px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: grab;
      font-size: 18px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .mini-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--icon-bg);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.5);
    }

    .mini-icon img {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    .row-meta {
      min-width: 0;
    }

    .row-meta strong,
    .row-meta span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-meta strong {
      font-size: 14px;
    }

    .row-meta span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .small-btn {
      min-width: 38px;
      padding: 0 10px;
      background: var(--glass-soft);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 100;
      transform: translate(-50%, 14px);
      padding: 11px 16px;
      border-radius: 14px;
      background: rgba(16, 24, 40, .82);
      color: #fff;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 14px 38px rgba(0,0,0,.26);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      white-space: nowrap;
      max-width: calc(100% - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 70%, white 30%);
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 20px, var(--content-width));
        padding-top: 16px;
      }

      .header {
        padding: 13px;
        border-radius: 25px;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 15px;
      }

      .text-btn {
        width: 46px;
        padding: 0;
        justify-content: center;
      }

      .text-btn .btn-label {
        display: none;
      }

      .search-panel {
        border-radius: 28px;
        align-items: stretch;
        flex-wrap: wrap;
        padding: 8px;
        margin-bottom: 30px;
      }

      .engines {
        width: 100%;
        justify-content: center;
        padding: 2px 0 0;
      }

      .search-form {
        width: 100%;
        flex: 0 0 100%;
        border-left: 0;
        border-top: 1px solid var(--inner-border);
      }

      .search-form input {
        height: 48px;
        text-align: center;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .tile {
        min-height: 105px;
        padding: 13px 10px;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        border-radius: 22px;
      }

      .site-host {
        display: none;
      }

      .site-name {
        max-width: 100%;
      }

      dialog {
        width: calc(100% - 12px);
        max-height: calc(100vh - 12px);
      }

      .dialog-card {
        max-height: calc(100vh - 12px);
        border-radius: 24px;
      }

      .site-row {
        grid-template-columns: 30px 40px minmax(0, 1fr);
      }

      .row-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }
    }

    @media (max-width: 380px) {
      .title span {
        display: none;
      }

      .header-actions {
        gap: 6px;
      }

      .round-btn,
      .text-btn {
        width: 42px;
        height: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <main class="page">
    <header class="header glass">
      <div class="brand">
        <div class="logo">
          <img src="https://cdn.nba.com/teams/uploads/sites/1610612744/2022/06/gsw-logo-1920.png" alt="Stephcu" />
        </div>
        <div class="title">
          <h1>Stephcu</h1>
          <span>Quick Links · 快速入口</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="round-btn" id="themeBtn" type="button" aria-label="切换主题"></button>
        <button class="text-btn" id="editSitesBtn" type="button" aria-haspopup="dialog" aria-controls="siteDialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
          </svg>
          <span class="btn-label">编辑站点</span>
        </button>
      </div>
    </header>

    <section class="search-panel glass" aria-label="搜索">
      <div class="engines" role="group" aria-label="搜索引擎">
        <button class="engine-btn active" data-engine="bing" type="button" title="Bing 搜索" aria-pressed="true">
          <img src="https://www.bing.com/favicon.ico" alt="Bing" />
        </button>
        <button class="engine-btn" data-engine="google" type="button" title="Google 搜索" aria-pressed="false">
          <img src="https://www.google.com/favicon.ico" alt="Google" />
        </button>
        <button class="engine-btn" data-engine="baidu" type="button" title="Baidu 搜索" aria-pressed="false">
          <img src="https://www.baidu.com/favicon.ico" alt="Baidu" />
        </button>
      </div>

      <form class="search-form" id="searchForm" action="https://www.bing.com/search" method="get" target="_blank">
        <input type="text" name="q" id="searchInput" placeholder="Bing Result" autocomplete="off" aria-label="搜索关键词" />
      </form>
    </section>

    <section aria-labelledby="siteTitle">
      <div class="section-head">
        <h2 id="siteTitle">快捷入口</h2>
        <span class="site-count" id="siteCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <dialog id="siteDialog">
    <div class="dialog-card glass">
      <div class="dialog-head">
        <h3>编辑站点</h3>
        <button class="round-btn" id="closeDialogBtn" type="button" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="dialog-body">
        <div class="editor-layout">
          <section class="editor-panel">
            <h4 id="formTitle">添加站点</h4>
            <form id="siteForm" novalidate>
              <input type="hidden" id="editingId" />

              <div class="field">
                <label for="siteName">名称</label>
                <input id="siteName" maxlength="40" required />
              </div>

              <div class="field">
                <label for="siteUrl">链接</label>
                <input id="siteUrl" inputmode="url" placeholder="https://example.com" required />
              </div>

              <div class="field">
                <label for="siteIcon">图标链接（可选）</label>
                <input id="siteIcon" inputmode="url" placeholder="https://example.com/icon.png" />
              </div>

              <div class="form-actions">
                <button class="primary-btn" type="submit" id="saveSiteBtn">保存</button>
                <button class="small-btn" type="button" id="cancelEditBtn">清空</button>
              </div>
            </form>
          </section>

          <section class="editor-panel">
            <h4>站点列表</h4>
            <div class="site-list" id="siteList"></div>
          </section>
        </div>
      </div>

      <div class="dialog-foot">
        <div class="foot-actions">
          <button class="danger-btn" id="resetBtn" type="button">恢复默认</button>
        </div>
        <button class="small-btn" id="doneBtn" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const DEFAULT_SITES = [
        { id: "google", name: "Google", url: "https://www.google.com", icon: "" },
        { id: "chatgpt", name: "ChatGPT", url: "https://chatgpt.com", icon: "" },
        { id: "gemini", name: "Gemini", url: "https://gemini.google.com", icon: "" },
        { id: "github", name: "GitHub", url: "https://github.com", icon: "" },
        { id: "youtube", name: "YouTube", url: "https://www.youtube.com", icon: "" },
        { id: "netflix", name: "Netflix", url: "https://www.netflix.com", icon: "" },
        { id: "apple-music", name: "Apple Music", url: "https://music.apple.com/cn/browse", icon: "" },
        { id: "internet-archive", name: "Internet Archive", url: "https://archive.org", icon: "" },
        { id: "bilibili", name: "Bilibili", url: "https://www.bilibili.com", icon: "" },
        { id: "douyin", name: "抖音", url: "https://www.douyin.com", icon: "" },
        { id: "cnki", name: "中国知网", url: "https://www.cnki.net", icon: "" },
        { id: "yanweb", name: "科研工具", url: "https://www.yanweb.top/", icon: "" },
        { id: "zdic", name: "汉典", url: "https://www.zdic.net", icon: "" },
        { id: "shidianguji", name: "识典古籍", url: "https://www.shidianguji.com/zh", icon: "" },
        { id: "gzhu", name: "数字广大", url: "https://webvpn.gzhu.edu.cn/https/77726476706e69737468656265737421fef256913e7e6f4a761dc7a99c406d36d9/up/view?m=up#act=portal/viewhome", icon: "" }
      ];

      const ENGINES = {
        bing: { action: "https://www.bing.com/search", name: "q", placeholder: "Bing Result" },
        google: { action: "https://www.google.com/search", name: "q", placeholder: "Google Result" },
        baidu: { action: "https://www.baidu.com/s", name: "wd", placeholder: "Baidu Result" }
      };

      const STORAGE = {
        sites: "stephcu.sites.v4",
        theme: "stephcu.theme.v4",
        engine: "stephcu.engine.v4"
      };

      const root = document.documentElement;
      const themeBtn = document.getElementById("themeBtn");
      const editSitesBtn = document.getElementById("editSitesBtn");
      const grid = document.getElementById("grid");
      const siteCount = document.getElementById("siteCount");
      const siteDialog = document.getElementById("siteDialog");
      const closeDialogBtn = document.getElementById("closeDialogBtn");
      const doneBtn = document.getElementById("doneBtn");
      const siteForm = document.getElementById("siteForm");
      const editingId = document.getElementById("editingId");
      const siteName = document.getElementById("siteName");
      const siteUrl = document.getElementById("siteUrl");
      const siteIcon = document.getElementById("siteIcon");
      const formTitle = document.getElementById("formTitle");
      const saveSiteBtn = document.getElementById("saveSiteBtn");
      const cancelEditBtn = document.getElementById("cancelEditBtn");
      const siteList = document.getElementById("siteList");
      const resetBtn = document.getElementById("resetBtn");
      const toast = document.getElementById("toast");
      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const engineBtns = [...document.querySelectorAll(".engine-btn")];

      const sunIcon = `<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`;
      const moonIcon = `<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>`;
      const autoIcon = `<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z"/></svg>`;

      let sites = loadSites();
      let themeMode = storageGet(STORAGE.theme) || "auto";
      let selectedEngine = storageGet(STORAGE.engine) || "bing";
      let draggedId = null;
      let autoThemeTimer = null;

      function storageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // 某些浏览器在 file:// 或隐私模式下可能禁用本地存储。
        }
      }

      function cloneDefaults() {
        return DEFAULT_SITES.map(site => ({ ...site }));
      }

      function loadSites() {
        const raw = storageGet(STORAGE.sites);
        if (!raw) return cloneDefaults();

        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return cloneDefaults();

          return parsed
            .map(item => ({
              id: String(item.id || createId()),
              name: String(item.name || "").trim(),
              url: normalizeUrl(item.url),
              icon: item.icon ? normalizeUrl(item.icon) : ""
            }))
            .filter(item => item.name && isHttpUrl(item.url));
        } catch {
          return cloneDefaults();
        }
      }

      function saveSites() {
        storageSet(STORAGE.sites, JSON.stringify(sites));
      }

      function createId() {
        return window.crypto?.randomUUID?.() || `site-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        return /^https?:\/\//i.test(text) ? text : `https://${text}`;
      }

      function isHttpUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function hostOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }

      function getIconCandidates(site) {
        const host = hostOf(site.url);
        const candidates = [];

        if (site.icon && isHttpUrl(site.icon)) candidates.push(site.icon);
        candidates.push(`https://api.iowen.cn/favicon/${host}.png`);
        candidates.push(`https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(site.url)}`);
        candidates.push(`https://icons.duckduckgo.com/ip3/${host}.ico`);
        candidates.push(makeLetterIcon(site.name));

        return candidates;
      }

      function makeLetterIcon(name) {
        const letter = (String(name).trim()[0] || "S").toUpperCase().replace(/[<>&\"']/g, "");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aa8ff"/><stop offset="1" stop-color="#4a5fe8"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><text x="32" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="700" fill="white">${letter}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function setIconWithFallback(img, site) {
        const candidates = getIconCandidates(site);
        let index = 0;

        const next = () => {
          if (index >= candidates.length) return;
          img.src = candidates[index++];
        };

        img.onerror = next;
        next();
      }

      function renderSites() {
        grid.textContent = "";
        const fragment = document.createDocumentFragment();

        sites.forEach(site => {
          const link = document.createElement("a");
          link.className = "tile glass";
          link.href = site.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.title = site.name;

          const iconBox = document.createElement("div");
          iconBox.className = "icon-box";

          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          setIconWithFallback(img, site);
          iconBox.appendChild(img);

          const text = document.createElement("div");
          text.className = "site-text";

          const name = document.createElement("div");
          name.className = "site-name";
          name.textContent = site.name;

          const host = document.createElement("div");
          host.className = "site-host";
          host.textContent = hostOf(site.url);

          text.append(name, host);
          link.append(iconBox, text);
          fragment.appendChild(link);
        });

        grid.appendChild(fragment);
        siteCount.textContent = `${sites.length} 个站点`;
      }

      function renderEditorList() {
        siteList.textContent = "";
        const fragment = document.createDocumentFragment();

        sites.forEach((site, index) => {
          const row = document.createElement("div");
          row.className = "site-row";
          row.draggable = true;
          row.dataset.id = site.id;

          const handle = document.createElement("button");
          handle.type = "button";
          handle.className = "drag-handle";
          handle.title = "拖动排序";
          handle.setAttribute("aria-label", `拖动 ${site.name}`);
          handle.textContent = "⋮⋮";

          const icon = document.createElement("div");
          icon.className = "mini-icon";
          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          setIconWithFallback(img, site);
          icon.appendChild(img);

          const meta = document.createElement("div");
          meta.className = "row-meta";
          const name = document.createElement("strong");
          name.textContent = site.name;
          const url = document.createElement("span");
          url.textContent = site.url;
          meta.append(name, url);

          const actions = document.createElement("div");
          actions.className = "row-actions";

          const upBtn = makeActionButton("↑", "上移", () => moveSite(index, index - 1));
          const downBtn = makeActionButton("↓", "下移", () => moveSite(index, index + 1));
          const editBtn = makeActionButton("编辑", `编辑 ${site.name}`, () => beginEdit(site.id));
          const deleteBtn = makeActionButton("删除", `删除 ${site.name}`, () => deleteSite(site.id));

          upBtn.disabled = index === 0;
          downBtn.disabled = index === sites.length - 1;

          actions.append(upBtn, downBtn, editBtn, deleteBtn);
          row.append(handle, icon, meta, actions);

          row.addEventListener("dragstart", event => {
            draggedId = site.id;
            row.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
          });

          row.addEventListener("dragend", () => {
            draggedId = null;
            row.classList.remove("dragging");
          });

          row.addEventListener("dragover", event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
          });

          row.addEventListener("drop", event => {
            event.preventDefault();
            if (!draggedId || draggedId === site.id) return;
            const from = sites.findIndex(item => item.id === draggedId);
            const to = sites.findIndex(item => item.id === site.id);
            moveSite(from, to);
          });

          fragment.appendChild(row);
        });

        siteList.appendChild(fragment);
      }

      function makeActionButton(text, label, handler) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "small-btn";
        button.textContent = text;
        button.setAttribute("aria-label", label);
        button.addEventListener("click", handler);
        return button;
      }

      function moveSite(from, to) {
        if (from < 0 || to < 0 || from >= sites.length || to >= sites.length || from === to) return;
        const next = sites.slice();
        const [item] = next.splice(from, 1);
        next.splice(to, 0, item);
        sites = next;
        saveSites();
        renderAll();
      }

      function beginEdit(id) {
        const site = sites.find(item => item.id === id);
        if (!site) return;

        editingId.value = site.id;
        siteName.value = site.name;
        siteUrl.value = site.url;
        siteIcon.value = site.icon || "";
        formTitle.textContent = "编辑站点";
        saveSiteBtn.textContent = "更新";
        siteName.focus();
      }

      function clearForm() {
        editingId.value = "";
        siteForm.reset();
        formTitle.textContent = "添加站点";
        saveSiteBtn.textContent = "保存";
      }

      function deleteSite(id) {
        const site = sites.find(item => item.id === id);
        if (!site) return;
        if (!window.confirm(`确定删除“${site.name}”吗？`)) return;

        sites = sites.filter(item => item.id !== id);
        saveSites();
        clearForm();
        renderAll();
        showToast("已删除");
      }

      function handleSiteSubmit(event) {
        event.preventDefault();

        const id = editingId.value.trim();
        const name = siteName.value.trim();
        const url = normalizeUrl(siteUrl.value);
        const icon = siteIcon.value.trim() ? normalizeUrl(siteIcon.value) : "";

        if (!name) {
          showToast("请输入站点名称");
          siteName.focus();
          return;
        }

        if (!isHttpUrl(url)) {
          showToast("请输入有效链接");
          siteUrl.focus();
          return;
        }

        if (icon && !isHttpUrl(icon)) {
          showToast("请输入有效图标链接");
          siteIcon.focus();
          return;
        }

        const duplicate = sites.some(item => item.url === url && item.id !== id);
        if (duplicate) {
          showToast("该链接已存在");
          return;
        }

        if (id) {
          sites = sites.map(item => item.id === id ? { id, name, url, icon } : item);
          showToast("已更新");
        } else {
          sites.push({ id: createId(), name, url, icon });
          showToast("已添加");
        }

        saveSites();
        clearForm();
        renderAll();
      }

      function resetSites() {
        if (!window.confirm("恢复全部默认站点？")) return;
        sites = cloneDefaults();
        saveSites();
        clearForm();
        renderAll();
        showToast("已恢复默认站点");
      }

      function renderAll() {
        renderSites();
        renderEditorList();
      }

      function resolveTheme() {
        if (themeMode === "light" || themeMode === "dark") return themeMode;
        const hour = new Date().getHours();
        return hour >= 6 && hour < 18 ? "light" : "dark";
      }

      function applyTheme() {
        const resolved = resolveTheme();
        root.dataset.theme = resolved;

        if (themeMode === "auto") {
          themeBtn.innerHTML = autoIcon;
          themeBtn.title = `自动主题 · 当前${resolved === "dark" ? "深色" : "浅色"}`;
          themeBtn.setAttribute("aria-label", `自动主题，当前${resolved === "dark" ? "深色" : "浅色"}`);
        } else if (themeMode === "light") {
          themeBtn.innerHTML = sunIcon;
          themeBtn.title = "浅色主题";
          themeBtn.setAttribute("aria-label", "浅色主题");
        } else {
          themeBtn.innerHTML = moonIcon;
          themeBtn.title = "深色主题";
          themeBtn.setAttribute("aria-label", "深色主题");
        }

        scheduleAutoTheme();
      }

      function cycleTheme() {
        const order = ["auto", "light", "dark"];
        themeMode = order[(order.indexOf(themeMode) + 1) % order.length];
        storageSet(STORAGE.theme, themeMode);
        applyTheme();
        showToast(themeMode === "auto" ? "主题：自动" : themeMode === "light" ? "主题：浅色" : "主题：深色");
      }

      function scheduleAutoTheme() {
        window.clearTimeout(autoThemeTimer);
        if (themeMode !== "auto") return;

        const now = new Date();
        const next = new Date(now);
        if (now.getHours() < 6) {
          next.setHours(6, 0, 0, 0);
        } else if (now.getHours() < 18) {
          next.setHours(18, 0, 0, 0);
        } else {
          next.setDate(next.getDate() + 1);
          next.setHours(6, 0, 0, 0);
        }
        autoThemeTimer = window.setTimeout(applyTheme, Math.max(1000, next - now));
      }

      function applyEngine(type) {
        const config = ENGINES[type] || ENGINES.bing;
        selectedEngine = ENGINES[type] ? type : "bing";
        storageSet(STORAGE.engine, selectedEngine);

        searchForm.action = config.action;
        searchInput.name = config.name;
        searchInput.placeholder = config.placeholder;

        engineBtns.forEach(button => {
          const active = button.dataset.engine === selectedEngine;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      themeBtn.addEventListener("click", cycleTheme);
      editSitesBtn.addEventListener("click", () => {
        siteDialog.showModal();
        renderEditorList();
      });
      closeDialogBtn.addEventListener("click", () => siteDialog.close());
      doneBtn.addEventListener("click", () => siteDialog.close());
      cancelEditBtn.addEventListener("click", clearForm);
      siteForm.addEventListener("submit", handleSiteSubmit);
      resetBtn.addEventListener("click", resetSites);

      engineBtns.forEach(button => {
        button.addEventListener("click", () => applyEngine(button.dataset.engine));
      });

      searchForm.addEventListener("submit", event => {
        if (!searchInput.value.trim()) {
          event.preventDefault();
          searchInput.focus();
        }
      });

      window.addEventListener("storage", event => {
        if (event.key === STORAGE.sites) {
          sites = loadSites();
          renderAll();
        }
        if (event.key === STORAGE.theme) {
          themeMode = event.newValue || "auto";
          applyTheme();
        }
        if (event.key === STORAGE.engine) {
          applyEngine(event.newValue || "bing");
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && themeMode === "auto") applyTheme();
      });

      if (!ENGINES[selectedEngine]) selectedEngine = "bing";
      if (!["auto", "light", "dark"].includes(themeMode)) themeMode = "auto";

      applyTheme();
      applyEngine(selectedEngine);
      renderAll();
    })();
  </script>
</body>
</html>
